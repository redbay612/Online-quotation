<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倉位租賃正式報價系統 - 材積版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --green: #27ae60; --bg: #f4f7f6; }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .container { max-width: 1250px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); border-bottom: 3px solid var(--primary); padding-bottom: 10px; }
        .panel { background: #fff; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .input-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 15px; }
        .input-group { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: var(--primary); }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .cart-list { min-height: 40px; border: 2px dashed #ddd; padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .tag { background: #34495e; color: white; padding: 6px 14px; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .tag-remove { cursor: pointer; font-weight: bold; }
        .btn { padding: 10px 22px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-blue { background: #3498db; color: white; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-green { background: #27ae60; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 13px; }
        th { background: #f8f9fa; }
        .section-title { background: #ecf0f1; padding: 10px; border-left: 5px solid var(--primary); margin: 20px 0 10px; font-weight: bold; }
        #final-invoice { display: none; border: 2px solid #333; padding: 40px; background: white; margin-top: 30px; }
        .invoice-header { display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .total-row { background: #fff5f5; font-size: 1.2em; font-weight: bold; color: var(--accent); }
        .discount-text { color: #e74c3c; font-weight: bold; }
        @media print {
            .no-print, .panel, .btn, h1, #preview-area { display: none !important; }
            .container { box-shadow: none; border: none; width: 100%; padding: 0; }
            #final-invoice { display: block !important; border: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>倉位租賃正式報價系統</h1>

    <!-- 第一步 -->
    <div class="panel no-print">
        <div class="section-title">第一步：基本設定與匯入</div>
        <div class="input-row">
            <div class="input-group">
                <label>選擇承租據點</label>
                <select id="branchSelect">
                    <option value="">-- 請選擇據點 --</option>
                    <optgroup label="北部">
                        <option>【文山區】文山萬慶倉庫</option><option>【大安區】忠孝東二號倉庫</option><option>【大安區】仁愛二號倉庫</option>
                        <option>【中正區】南門倉庫</option><option>【中正區】台北車站倉庫</option><option>【中山區】中山倉庫</option>
                        <option>【中和區】中和威力倉庫</option><option>【三重區】三重光復倉庫</option><option>【新莊區】新莊民安倉庫</option>
                    </optgroup>
                    <optgroup label="桃竹苗">
                        <option>【桃園區】桃園經國倉庫</option><option>【中壢區】桃園中壢倉庫</option><option>【東區】新竹中華倉庫</option>
                    </optgroup>
                    <optgroup label="中南部">
                        <option>【西屯區】台中青海倉庫</option><option>【中西區】台南民生倉庫</option><option>【新興區】高雄復興倉庫</option>
                    </optgroup>
                </select>
            </div>
            <div class="input-group">
                <label>客戶姓名</label>
                <input type="text" id="clientName" placeholder="輸入客戶姓名">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>2. 匯入 Excel 檔案</label>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>3. 搜尋並加入倉位 (依編號或材積數)</label>
                <input type="text" id="searchBox" placeholder="輸入關鍵字如: SU02 或 45" oninput="filterStorage()">
            </div>
            <div class="input-group">
                <label>選擇結果</label>
                <div style="display: flex; gap: 10px;">
                    <select id="storageSelect" style="flex: 1;"><option value="">請先讀取檔案</option></select>
                    <button class="btn btn-blue" onclick="addToCart()">＋加入清單</button>
                </div>
            </div>
        </div>
        <div class="cart-list" id="cartList"></div>
        <div style="text-align: center;"><button class="btn btn-red" onclick="renderPreview()">確認清單並設定方案</button></div>
    </div>

    <!-- 第二步：詳細方案設定 -->
    <div id="preview-area" class="panel no-print" style="display:none;">
        <div class="section-title">第二步：折扣與各別租期設定</div>
        <div class="input-row">
            <div class="input-group">
                <label>全案活動折扣 (如 0.9 = 9折 / 1 = 原價)</label>
                <input type="number" id="discountRate" step="0.01" value="1.0">
            </div>
            <div class="input-group" style="flex: 2;">
                <label>活動與折扣備註說明</label>
                <input type="text" id="extraNote" placeholder="例如：母親節優惠價、新客優惠...">
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>倉位號碼</th>
                    <th>尺寸 / 材積</th>
                    <th>月租原價</th>
                    <th>選擇租期方案</th>
                    <th>其他/包材費</th>
                    <th style="background-color: #fff9db;">活動折抵金額 (減免)</th>
                </tr>
            </thead>
            <tbody id="settle-setup-body"></tbody>
        </table>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn btn-green" onclick="generateInvoice()">產生合併服務報價單</button>
        </div>
    </div>

    <!-- 第三步：正式報價單 -->
    <div id="final-invoice">
        <div class="invoice-header">
            <div>
                <h2 style="margin:0;">倉位租賃服務報價單 (合併)</h2>
                <p>承租據點：<strong id="inv-branch"></strong></p>
                <p>客戶姓名：<strong id="inv-client"></strong></p>
            </div>
            <div style="text-align: right;">
                <p>報價日期：<span id="inv-date"></span></p>
                <p>單號：<span id="inv-id"></span></p>
            </div>
        </div>
        <table id="final-table">
            <thead>
                <tr>
                    <th>倉位號碼 / 規格</th>
                    <th>租期</th>
                    <th>押金 (原價)</th>
                    <th>預付租金 (活動價)</th>
                    <th>保險文書費</th>
                    <th>其他費用</th>
                    <th>活動折抵</th>
                    <th>小計</th>
                </tr>
            </thead>
            <tbody id="invoice-body"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td colspan="7" style="text-align: right;">全案應付總金額 (Grand Total)：</td>
                    <td id="inv-total"></td>
                </tr>
            </tfoot>
        </table>
        <div id="res-note-area" style="text-align:left; font-size:13px; border:1px solid #ddd; padding:10px; margin-top:10px;">
            <strong>備註說明：</strong><span id="inv-note"></span>
        </div>
        <div style="font-size:11px; color:#666; margin-top:10px; text-align:left;">
            收費細則：1. 押金規則：季繳(含)以上方案收1個月原價押金；月繳收2個月。 2. 保險費：月租$2999以下收$80；$3000以上收$150。 3. 有效期7天。
        </div>
        <div class="no-print" style="margin-top:30px; text-align:right;">
            <button class="btn btn-blue" onclick="window.print()">列印 / 下載 PDF</button>
        </div>
    </div>
</div>

<script>
    let db = [];
    let cart = [];
    const termNames = { 1: "月繳", 3: "季繳", 6: "半年繳", 12: "年繳" };

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
            
            let hIdx = -1;
            for (let i = 0; i < Math.min(rows.length, 10); i++) {
                const r = rows[i].map(c => String(c || "").trim());
                if (r.some(c => c.includes("倉位") || c.includes("月租"))) { hIdx = i; break; }
            }

            if (hIdx === -1) return alert("找不到標題列");
            const headers = rows[hIdx].map(h => String(h || "").trim());
            const colMap = {
                no: headers.findIndex(h => h.includes("倉位") || h.includes("編號")),
                spec: headers.findIndex(h => h.includes("尺寸") || h.includes("W*L*H")),
                vol: headers.findIndex(h => h.includes("英尺") || h.includes("材積")),
                m: headers.findIndex(h => h.includes("月租") || h.includes("月繳"))
            };

            db = rows.slice(hIdx + 1).filter(r => r[colMap.m]).map(r => ({
                no: String(r[colMap.no] || "N/A"),
                spec: String(r[colMap.spec] || ""),
                vol: String(r[colMap.vol] || "0"),
                mPrice: parseFloat(String(r[colMap.m]).replace(/[^\d.]/g, '')) || 0
            }));
            updateSelectOptions(db);
            alert("匯入成功！已讀取到材積資訊。");
        };
        reader.readAsArrayBuffer(file);
    });

    function filterStorage() {
        const key = document.getElementById('searchBox').value.toLowerCase();
        updateSelectOptions(db.filter(i => i.no.toLowerCase().includes(key) || i.vol.includes(key)));
    }

    function updateSelectOptions(items) {
        const s = document.getElementById('storageSelect');
        s.innerHTML = items.map(i => `<option value="${i.no}">[${i.no}] ${i.vol}材積 (${i.spec})</option>`).join('');
    }

    function addToCart() {
        const no = document.getElementById('storageSelect').value;
        if (!no || cart.find(i => i.no === no)) return;
        const item = db.find(i => i.no === no);
        if (item) { cart.push(item); renderCart(); }
    }

    function renderCart() {
        document.getElementById('cartList').innerHTML = cart.map(i => `<div class="tag">${i.no} (${i.vol}材積)<span onclick="removeCart('${i.no}')" style="margin-left:8px;cursor:pointer;">×</span></div>`).join('');
    }

    function removeCart(no) {
        cart = cart.filter(i => i.no !== no);
        renderCart();
    }

    function renderPreview() {
        if (cart.length === 0) return alert("清單為空");
        const body = document.getElementById('settle-setup-body');
        body.innerHTML = cart.map((i, idx) => `
            <tr>
                <td><strong>${i.no}</strong></td>
                <td>${i.vol} 材積 / ${i.spec}</td>
                <td>$${i.mPrice.toLocaleString()}</td>
                <td>
                    <select class="cart-term">
                        <option value="1">月繳</option>
                        <option value="3" selected>季繳</option>
                        <option value="6">半年繳</option>
                        <option value="12">年繳</option>
                    </select>
                </td>
                <td><input type="number" class="cart-other" value="0" style="width:70px"></td>
                <td><input type="number" class="cart-promo-minus" value="0" style="width:100px; border:2px solid #ffe58f;"></td>
            </tr>
        `).join('');
        document.getElementById('preview-area').style.display = 'block';
    }

    function generateInvoice() {
        const branch = document.getElementById('branchSelect').value;
        if (!branch) return alert("請選擇據點");

        const discountRate = parseFloat(document.getElementById('discountRate').value) || 1;
        const terms = document.querySelectorAll('.cart-term');
        const others = document.querySelectorAll('.cart-other');
        const minuses = document.querySelectorAll('.cart-promo-minus');
        
        let html = "";
        let grandTotal = 0;

        cart.forEach((item, idx) => {
            const months = parseInt(terms[idx].value);
            const otherFee = parseFloat(others[idx].value) || 0;
            const promoMinus = parseFloat(minuses[idx].value) || 0;
            
            const deposit = (months >= 3) ? item.mPrice : (item.mPrice * 2);
            const rent = Math.round(item.mPrice * months * discountRate);
            const insUnit = (item.mPrice < 3000) ? 80 : 150;
            const insTotal = insUnit * months;
            const subtotal = deposit + rent + insTotal + otherFee - promoMinus;
            grandTotal += subtotal;

            html += `<tr>
                <td style="text-align:left;"><strong>${item.no}</strong><br><small>${item.vol}材積 / ${item.spec}</small></td>
                <td>${termNames[months]}</td>
                <td>$${deposit.toLocaleString()}</td>
                <td>$${rent.toLocaleString()}</td>
                <td>$${insTotal.toLocaleString()}</td>
                <td>$${otherFee.toLocaleString()}</td>
                <td class="discount-text">-$${promoMinus.toLocaleString()}</td>
                <td style="font-weight:bold;">$${subtotal.toLocaleString()}</td>
            </tr>`;
        });

        document.getElementById('inv-branch').innerText = branch;
        document.getElementById('inv-client').innerText = document.getElementById('clientName').value || "尊貴客戶";
        document.getElementById('inv-date').innerText = new Date().toLocaleDateString();
        document.getElementById('inv-id').innerText = "QT-" + Date.now().toString().slice(-6);
        document.getElementById('invoice-body').innerHTML = html;
        document.getElementById('inv-total').innerText = "$ " + grandTotal.toLocaleString();
        document.getElementById('inv-note').innerText = document.getElementById('extraNote').value || "無";
        
        document.getElementById('final-invoice').style.display = 'block';
        window.scrollTo(0, document.getElementById('final-invoice').offsetTop);
    }
</script>
</body>
</html>
